<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rvrb Auto-Like</title>
    <style>
      :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
      body { width: 260px; margin: 0; padding: 20px; }
      h1 { font-size: 18px; margin: 0 0 16px; }
      label { display: flex; align-items: center; gap: 8px; }
      input { accent-color: #7965df; }
      p { line-height: 1.5; margin-bottom: 0; }
      #status { font-size: 12px; }
    </style>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <h1>rvrb Auto-Like</h1>
    <label><input id="enabled" type="checkbox" disabled> Enable automatic voting</label>
    <p><label for="delay">Check delay (seconds)</label></p>
    <input id="delay" type="number" min="1" max="3600" step="1" value="15" disabled aria-describedby="delay-help">
    <p id="delay-help">1–3600 seconds. First check is immediate.</p>
    <p>Only runs on <strong>app.rvrb.one</strong>.</p>
    <p id="status" role="status">Loading setting…</p>
  </body>
</html>
